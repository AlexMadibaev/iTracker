<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><link rel="stylesheet" href="styles.css"><title>iTracker</title></head><body><header><div class="logo">✓</div><div><b>iTracker</b><small>Личный трекер</small></div><div class="xp" id="xp">0 XP</div></header><main><h1>Сегодня</h1><div class="progress"><div><b id="percent">0%</b><small>прогресс дня</small></div><div><b id="streak">🔥 1</b><small>серия</small></div></div><section><div class="head"><h2>Большая тройка</h2><button onclick="add()">＋</button></div><div id="tasks"></div></section></main><nav><button>◉<small>Сегодня</small></button><button>▦<small>Неделя</small></button><button>◫<small>Канбан</small></button><button>✦<small>Ачивки</small></button></nav><dialog id="dlg"><form method="dialog" onsubmit="createTask()"><h2>Новая задача</h2><input id="title" placeholder="Что нужно сделать?" required><select id="priority"><option value="medium">Средний</option><option value="high">Высокий</option><option value="urgent">Срочно</option><option value="low">Низкий</option></select><button class="primary">Создать</button><button value="cancel">Отмена</button></form></dialog><script src="app.js"></script></body></html>
