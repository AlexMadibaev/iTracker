<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><link rel="stylesheet" href="styles.css"><title>iTracker</title></head><body>
<div id="onboarding" class="onboarding hidden"><div class="orb"><span>✓</span><i>✦</i></div><div class="welcome"><small>ДОБРО ПОЖАЛОВАТЬ В</small><h1>iTracker</h1><p>Сфокусируйся на главном. Выполняй задачи, набирай XP и двигайся вперёд каждый день.</p><div class="nameStep"><label>Как вас зовут?</label><input id="userName" autocomplete="name" placeholder="Ваше имя"><button class="primary big" onclick="finishOnboarding()">Продолжить <b>→</b></button></div></div></div>
<div id="app"><header><div class="brandIcon"><span>✓</span><i>✦</i></div><div><b>iTracker</b><small id="greeting">Личный трекер</small></div><div class="xp" id="xp">0 XP</div></header><main><div class="hello"><small id="dayline"></small><h1 id="helloTitle">Сегодня</h1></div><div class="progress"><div><b id="percent">0%</b><small>прогресс дня</small></div><div><b id="streak">🔥 1</b><small>серия</small></div></div><section><div class="head"><div><h2>Большая тройка</h2><small>3 главные задачи на сегодня</small></div><button onclick="openAdd()">＋</button></div><div id="tasks"></div></section></main><nav><button class="active">◉<small>Сегодня</small></button><button>▦<small>Неделя</small></button><button>◫<small>Канбан</small></button><button>✦<small>Ачивки</small></button></nav></div>
<div id="sheetBackdrop" class="sheetBackdrop" onclick="closeAdd()"></div><section id="taskSheet" class="taskSheet"><div class="grab"></div><div class="sheetTop"><div><small>БЫСТРОЕ ДОБАВЛЕНИЕ</small><h2>Новая задача</h2></div><button class="x" onclick="closeAdd()">×</button></div><textarea id="title" rows="2" placeholder="Что нужно сделать?"></textarea><div class="chips"><button class="chip active" data-p="medium">● Средний</button><button class="chip" data-p="high">● Высокий</button><button class="chip" data-p="urgent">● Срочно</button><button class="chip" data-p="low">● Низкий</button></div><div class="sheetOptions"><button>◷ Сегодня</button><button>◉ BIG 3</button><button>＋ Подзадача</button></div><button class="primary big" onclick="createTask()">Добавить задачу <b>→</b></button></section>
<script src="app.js"></script></body></html>
